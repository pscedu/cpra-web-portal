{% extends 'modals/modal_base.html' %}
{% block modal_title %}
<h4> New Assignment </h4>
{% endblock %}
{% block modal_body %}


<script>
    $(document).ready(function(){
        $('select').select2({width: '100%', dropdownParent: $('#user-team-modal'), placeholder: "None", allowClear: true});
    });
</script>
    <div class="container">
        <div class="col-11">
            <label for="select-user-team-user">User</label>
            <select name="user_id_id" id="select-user-team-user" class="modal-form-control form-control">
                <option></option>
            {% for user_option in users %}
                <option value="{{ user_option.id }}">{{ user_option.username }}</option>
            {% endfor %}
            </select>
        </div>
    </div>
{% endblock %}
{% block modal_footer %}
    <button id="user-team-save" type="button" class="btn btn-primary">Save</button>
    <button type="button" class="btn btn-default" data-bs-dismiss="modal">Close</button>
{% endblock %}
