{% extends 'modals/modal_base.html' %}
{% block modal_title %}
<h4> New Validation Item Metric </h4>
{% endblock %}
{% block modal_body %}
        <label for="select-validation-item-metrics">Metric</label>
        <select name="metric_id_id" id="select-validation-item-metrics" class="modal-form-control form-control">
        {% for metric_option in metrics %}
            <option value="{{ metric_option.id }}">{{ metric_option.name }}</option>
        {% endfor %}
        </select>
{% endblock %}
{% block modal_footer %}
    <button id="validation-item-metrics-save" type="button" class="btn btn-primary">Save</button>
    <button type="button" class="btn btn-default" data-bs-dismiss="modal">Close</button>
{% endblock %}
