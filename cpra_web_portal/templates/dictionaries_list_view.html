{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container">
	<div class="row my-2">
		<div class="col-12">
			<ul class="nav nav-tabs" id="myTab" role="tablist">
			  <li class="nav-item">
				<a class="nav-link active" id="metrics-tab" data-toggle="tab" href="#metrics" role="tab" aria-controls="metrics" aria-selected="true">Metrics</a>
			  </li>
			  <li class="nav-item">
				<a class="nav-link" id="validation_items-tab" data-toggle="tab" href="#validation_items" role="tab" aria-controls="validation_items" aria-selected="false">Validation Items</a>
			  </li>
			  <li class="nav-item">
				<a class="nav-link" id="subroutines-tab" data-toggle="tab" href="#subroutines" role="tab" aria-controls="subroutines" aria-selected="false">Subroutines</a>
			  </li>
			  <li class="nav-item">
				<a class="nav-link" id="simulations-tab" data-toggle="tab" href="#simulations" role="tab" aria-controls="simulations" aria-selected="false">Simulations</a>
			  </li>
			</ul>
			<div class="tab-content" id="myTabContent">
			  <div class="tab-pane fade show active" id="metrics" role="tabpanel" aria-labelledby="metrics-tab">
					<table class="table table-hover">
					  <thead>
						<tr>
						  <th scope="col">Name</th>
						  <th scope="col">Type</th>
						</tr>
					  </thead>
					  <tbody>
						<tr>
						  <th scope="row">Image 10</th>
						  <td>Static</td>
						</tr>
						<tr>
						  <th scope="row">Salinity over Time</th>
						  <td>Live Graph</td>
						</tr>
					  </tbody>
					</table>
			  </div>
			  <div class="tab-pane fade" id="validation_items" role="tabpanel" aria-labelledby="validation_items-tab">
					<table class="table table-hover">
					  <thead>
						<tr>
						  <th scope="col">Name</th>
						</tr>
					  </thead>
					  <tbody>
						<tr>
						  <th scope="row">Salinity</th>
						</tr>
					  </tbody>
					</table>
			  </div>
			  <div class="tab-pane fade" id="subroutines" role="tabpanel" aria-labelledby="subroutines-tab">
					<table class="table table-hover">
					  <thead>
						<tr>
						  <th scope="col">Name</th>
						</tr>
					  </thead>
					  <tbody>
						<tr>
						  <th scope="row">ICM-Hydro</th>
						</tr>
					  </tbody>
					</table>
			  </div>
			  <div class="tab-pane fade" id="simulations" role="tabpanel" aria-labelledby="simulations-tab">
					<table class="table table-hover">
					  <thead>
						<tr>
						  <th scope="col">Name</th>
						</tr>
					  </thead>
					  <tbody>
						<tr>
						  <th scope="row">ICM</th>
						</tr>
					  </tbody>
					</table>
			  </div>
			</div>
		</div>
	</div>
	<div class="row">
		<button class="btn btn-primary">New</button>
	</div>
</div>
{% endblock %}
