{% extends 'base.html' %}
{% load static %}
{% block content %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js" integrity="sha512-QSkVNOCYLtj73J4hbmVoOV6KVZuMluZlioC+trLpewV8qMjsWqlIQvkn1KGX2StWvPMdWGBqim1xlC8krl1EKQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
    $(document).ready(function(){
        const metric_lookup = {
            'comp_mwl_NAVD88m':	'Mean Water Level (m)',
            'comp_wlv_m': 'Water Level Variability (m)',
            'comp_mean_sal_ppt': 'Mean Salinity (ppt)',
            'comp_2wk_max_sal_ppt': '2-week Maximum Salinity (ppt)',
            'pixel_z_NAVD88m': 'Pixel Height',
            'annual_mean_inun_depth_m': 'Annual Mean Innundation Depth (m)',
            'pixel_lndtyp': 'Land Type',
            'pixel_mnrl_dep_g/cm2-yr': 'Mineral Deposition (g/cm^2-yr)',
            'pixel_mnrl_accr_cm	Mineral': 'Accretion (cm)',
            'pixel_org_accum_g/cm2-yr':	'Organic Accumulation (g/cm^2-yr)',
            'pixel_org_accr_cm': 'Organic Accretion (cm)',
            'grid_FFIBS': 'FFIBS Score',
        }

        const color_list = ['#0092c5','#005372', '#00688d', '#007fad',
            '#006b66', '#007f79', '#08938c', '#0ba7a0',
            '#9fcc3b', '#5e8021', '#74992a', '#89b232',
        ]


		const $graph_container = $('#graph_container');
        const $sim_run_select = $('#sim_run_select');
        const $extraction_point_select = $('#extraction_point_select');
        const $metric_select = $('#metric_select');
        const $btn_add = $('#btn_add');
        const $title_input = $('#title_input');
        $sim_run_select.select2({width: '30%', placeholder: 'Scenario + Model Group'});
        $extraction_point_select.select2({width: '30%', placeholder: 'Extraction Point'});
        $metric_select.select2({width: '30%', placeholder: 'Metric'});

        let added_datasets = [];
        let active_dataset;

        Chart.defaults.font.family = "'Libre Franklin', sans-serif"
        let chart_config = {
            'type': 'line',
            'labels': [],
            'data': {'datasets':[]},
            'options': {
                'plugins': {
                    'title': {
                        'align': 'start',
                        'display': true,
                        'font': {
                            'size': 18
                        },
                        'text': 'EXTRACTION POINT COMPARISONS'
                    }
                },
                'scales': {
                    'x': {
                        'ticks': {
                            'stepSize': 1,
                            'max': 51,
                            'min': -1
                        },
                        'title': {
                            'text': 'Years -1-51',
                            'display': true,
                            'font': {
                                'size': 18
                            }
                        },
                        'type': 'linear'
                    }
                }
            }
        };

        for(let tick = -1; tick < 51; tick++)
            chart_config['labels'].push(tick)

        const $canvas = $('<canvas id="canvas-graph"></canvas>')
        $graph_container.append($canvas)

        let chart = new Chart($canvas, chart_config);

        $sim_run_select.on('change', function(){
            if($(this).val().length===0)
                return;

            // We need to get the available extraction points
            const sim_run_id = $sim_run_select.val();
            $extraction_point_select.empty();
            $metric_select.empty();
            $metric_select.data('metric_data', {})
            $metric_select.attr('disabled', true)
            $btn_add.attr('disabled', true)
            $.get('/extraction_points/?sim_run_id=' + sim_run_id, function(data) {
                const extraction_points = JSON.parse(data)['extraction_points'];
                $extraction_point_select.append(new Option('',''))
                for(let region in extraction_points){
                    for(let datapoint in extraction_points[region]){
                        $extraction_point_select.append(new Option(region+datapoint, extraction_points[region][datapoint]))
                    }
                }
                $extraction_point_select.removeAttr('disabled')
            })
        });

        $extraction_point_select.on('change', function(){
            if($(this).val().length===0)
                return;

            const sim_run_id = $sim_run_select.val();
            const file_name = $extraction_point_select.val();
            $metric_select.empty();
            $metric_select.data('metric_data', {})
            $.get('/extraction_point_values/?sim_run_id='+sim_run_id+'&file_name='+file_name, function(data){
                data = JSON.parse(data);
                let columns = Object.keys(data[0]);
                $metric_select.append(new Option('',''))
                for(let column in columns){
                    let val = columns[column];
                    if(val in metric_lookup)
                        $metric_select.append(new Option(metric_lookup[val], val))
                }
                $metric_select.data('metric_data', data)
                $metric_select.removeAttr('disabled')
            })
        });

        $metric_select.on('change', function(){
            if($(this).val().length===0)
                return;

            const data = $metric_select.data('metric_data');
            const column = $metric_select.val();
            const sim_run_name = $sim_run_select.find('option:selected').text();
            const extraction_point = $extraction_point_select.find('option:selected').text();
            $btn_add.attr('disabled', false)
            active_dataset = {
                'label': sim_run_name + ' ' + extraction_point + ' ' + metric_lookup[column],
                'data': [],
                'fill': false,
                'lineTension': 0,
                'type': 'line'
            }
            for(let year in data){
                active_dataset['data'].push({'x': year-1, 'y': data[year][column]})
            }

            chart.data.datasets = added_datasets.concat([active_dataset]);
            chart.update();
        });

        $btn_add.on('click', function(){
            $metric_select.val(null).trigger('change');

            // Take the active dataset, set the color to something else and add it to added_datasets
            // This will add the active dataset to the added datasets
            let color =  color_list[(added_datasets.length + 1) % color_list.length];
            active_dataset['backgroundColor'] = color;
            active_dataset['borderColor'] = color;
            added_datasets.push(active_dataset);
            chart.data.datasets = added_datasets;
            chart.update();

            // Create a rectangle/square/widget with this information to the left hand side
            let $card = $('#container_card_template').find('.card').clone();
            $card.find('.card-text').text(active_dataset['label'])
            $('#datasets_container').append($card);

            active_dataset = {};

            // Add a listener to remove the dataset from the added_datasets
            // and remove the card from the container
            $card.find('.btn-close').on('click', function(){
                let dataset_label = $card.find('.card-text').text();
                for(let i in added_datasets){
                    if(added_datasets[i]['label'] === dataset_label) {
                        added_datasets.splice(i, 1);
                        break;
                    }
                }

                chart.data.datasets =  $.isEmptyObject(active_dataset) ? added_datasets : added_datasets.concat([active_dataset]);

                chart.update();
                $card.remove();
            });

            $btn_add.attr('disabled', true)
        });

        $title_input.on('keyup', function(){
            chart.options.plugins.title.text = $(this).val().length === 0 ? 'EXTRACTION POINT COMPARISONS' : $(this).val().toUpperCase();
            chart.update();
        });

        $('#btn-export').on('click', function(){
            let a = document.createElement('a');
            a.download = chart.options.plugins.title.text;
            a.href = chart.toBase64Image();
            a.click();
        });
    });
</script>
<div class="row my-2">
    <div class="col-2" id="datasets_container">
    </div>
    <div class="col-9" id="graph_container"></div>
</div>
<div class="row my-2">
    <div class="col-2"></div>
    <div class="col-6">
        <select name="sim_run" id="sim_run_select">
            <option></option>
            {% for sr in srs %}
                <option value="{{ sr.id }}">{{ sr.name }}</option>
            {% endfor %}
        </select>
        <select name="extraction_point" id="extraction_point_select" disabled>
            <option></option>
        </select>
        <select name="metric" id="metric_select" disabled>
            <option></option>
        </select>
        <button class="btn btn-sm btn-primary" id="btn_add" disabled>Add</button>
    </div>
    <div class="col-2">
        <input id="title_input" class="form-control-sm" placeholder="Title">
    </div>
    <div class="col-1">
        <button class="btn btn-sm btn-secondary" id="btn-export">Export</button>
    </div>
</div>

<div id="container_card_template" style="display: none">
    <div class="card">
        <div class="card-body">
            <p class="card-text" style="display: inline;"></p>
            <span style="float: right;"><button type="button" class="btn-close" aria-label="Close"></button></span>
        </div>
    </div>
</div>

{% endblock %}
