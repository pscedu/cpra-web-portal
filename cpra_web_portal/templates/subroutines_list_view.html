{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container">
	<div class="row my-2">
		<div class="col-12">
			<h1>Subroutines</h1>
		</div>
	</div>
	<div class="row">
		<div class="col-12">
			<div class="list-group">
				{% for subroutine in subroutines %}
				<a href="{% url 'validation_items_list_view' %}?sr_id={{ subroutine.sr_id }}&sub_id={{ subroutine.sub_id }}" class="list-group-item">
					<h5 class="mb-1">ICM - FWOA (G500) - ICM-Hydro</h5>
					<p class="mb-1">1/1/2021</p>
				</a>
				{% endfor %}
			</div>
		</div>
	</div>
</div>
{% endblock %}
