<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<div class="row my-2">
    <h4>Filters</h4>
</div>
{% for filter_id, filter in filters.items %}
<div class="row my-2">
    {% if filter.type in 'multiselect,select' %}
    <label for="{{ filter_id }}">{{ filter.name }}</label>
    <select id="{{ filter_id }}" class="form-control filter-item"
    {% if filter.type == "multiselect" %}
    multiple
    {% endif %}
    >
        {% for option in filter.options %}
        <option value="{{ option.value }}"
                {% if option.value == filter.value or option.value in filter.value %}
                selected
                {% endif %}
        >{{ option.text }}</option>
        {% endfor %}
    </select>
    {% else %}
    {% if filter.type == 'checkbox' %}
<div class="form-check my-2">
  <input class="form-check-input filter-item" type="checkbox" value="{{ filter.value }}" id="{{ filter_id }}"
  {% if filter.value == 1 %} checked {% endif %}>
  <label class="form-check-label" for="{{ filter_id }}">{{ filter.name }}</label>
</div>
      {% endif %}
    {% endif %}
</div>
{% endfor %}
<div class="row my-2">
    <button id="btn_filter" class="btn btn-primary" onclick="filter()">Search</button>
</div>

<script>
    $(document).ready(function(){
        $('select').select2();
    })
    function filter(){
        let filters = {};
        Array.from(document.getElementsByClassName('filter-item')).forEach(function(el){
            let val;
            if(el.nodeName==="SELECT"){
                val = []
                $(el).select2('data').forEach(function(e, i){
                    val.push(parseInt(e.id))
                })
            }
            else if(el.type === 'checkbox'){
                val = el.checked ? '1' : '0'
            }
            else{
                val = el.value
            }

            console.log(val)
            if(val !== undefined && val.length >0)
                filters[el.getAttribute('id')] = val
        })

        if(filters.length === 0)
            return;

        filters = new URLSearchParams(filters).toString();

        let redirect = window.location.toString();
        if(redirect.indexOf("?") > 0)
            redirect = redirect.substring(0, redirect.indexOf("?"));

        window.location = redirect + '?' + filters
    }
</script>
