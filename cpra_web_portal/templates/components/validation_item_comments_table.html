<script>

    $(document).ready(function() {
        AjaxDatatableViewUtils.initialize_table(
            $('#validation_item_comments_table'),
            "{% url 'ajax_datatable_validation_item_comments' %}",
            {
                // extra_options (example)
                processing: false,
                autoWidth: false,
                full_row_select: true,
                scrollX: false,
            }, {
                // extra_data
                validation_item_id: {{ validation_item.id }}
            }
        );
    });

</script>

<div class="row">
    <div class="col-11">
        <h3>Comments</h3>
    </div>
    <div class="col-1">
    <button id="btn-new-comment" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-misc-comment">New</button>
    </div>
</div>
<table class="table table-hover" id="validation_item_comments_table">
</table>
