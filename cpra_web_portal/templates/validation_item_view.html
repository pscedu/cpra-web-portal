{% extends 'base.html' %}
{% load static %}
{% load util_filters %}
{% block content %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.panzoom/4.0.0/panzoom.min.js" integrity="sha512-9P4403el58YclVUmhMst5Bzpcy+i0V0F0wiMlrkTDgmVqYXhF+tccpnhGIHKzKPXKaTF0Q4J9UEhu2i6PckJWg==" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js" integrity="sha512-d9xgZrVZpmmQlfonhQUvTR7lMPtO7NkZMkA0ABN3PHCbKA5nqylQ/yWlFAyY6hYgdF1Qh6nYiuADWwKB4C2WSw==" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.css" integrity="sha512-C7hOmCgGzihKXzyPU/z4nv97W0d9bv4ALuuEbSf6hm93myico9qa0hv4dODThvCsqQUmKmLcJmlpRmCaApr83g==" crossorigin="anonymous" />
<script>
	$(document).ready(function(){
		{% if edit_permission %}
		{% else %}
			$('#btn-review').hide();
		{% endif %}

		const user_name = "{{ user.username }}"
		const csrftoken = Cookies.get('csrftoken');

		$('select').select2({width: '100%'});

		let $export_button = $('#btn-export');
		let $metric_container = $('#metric_container');
		let $metric_select = $('#metric_select');
		let $metric_name = $('#metric_name');
		let $select_static_metric_regions = $('#select_static_metric_region');
		let $select_static_metric_data_points = $('#select_static_metric_data_points');
		let $select_dynamic_graph_metric_regions = $('#select_dynamic_graph_metric_region');
		let $select_dynamic_graph_metric_data_points = $('#select_dynamic_graph_metric_data_points');
		let $select_dynamic_graph_metric_year =	$('#select_dynamic_graph_metric_year');
		let $select_map_year = $('#select_map_year');

		// Initial Load Sequence
		// Set the title of the page equal to the selected value

		metric_change();

		function metric_change(){
			$metric_name.text($metric_select.val());
			let metric_id = $metric_select.find('option:selected').data('metric_id');
			if(metric_id===undefined) {
				$metric_name.text('No metrics defined')
				return;
			}
			//Grab the needed data
			// So what do we need? Type to set which options container to show
			// We need.... the data to fill out said containers
			$.get('/metric/?metric_id=' + metric_id + '&validation_assignment_id={{ validation_item.id }}', function(data){
				data = JSON.parse(data);
				let metric_data = data['metric']
				let files = data['files']

				$metric_container.empty();

				// hide option containers
				$('.metric_options').hide();

				// This is where we need to figure out which container we need populate
				switch (metric_data['type']){
					case 'static':
						populate_static_metrics(metric_data, files)
						break;
					case 'dynamic_graph':
						populate_dynamic_graph_metrics(metric_data, files)
						break;
					case 'map':
						populate_map_metrics(metric_data, files)
						break;
					default:
						console.log(metric_data['type'])
						break;
				}

				load_comments();
			});
		}

		function populate_static_metrics(metric, files){
			let $static_metric_options = $('#static_metric_options');

			$select_static_metric_regions.empty();

			for(let region in files){
				$select_static_metric_regions.append(new Option(region, JSON.stringify(files[region])));
			}

			populate_static_metric_data_points($select_static_metric_regions.find('option:selected').val());
			populate_static_metric_container();

			$static_metric_options.show();
		}

		function populate_static_metric_data_points(data_points){
			data_points = JSON.parse(data_points);
			$select_static_metric_data_points.empty();
			for(let data_point in data_points){
				$select_static_metric_data_points.append(new Option(data_point, data_points[data_point]))
			}
		}

		function populate_static_metric_container(){
			$metric_container.empty();
			let metric_id = $metric_select.find('option:selected').data('metric_id');
			let file_name = $select_static_metric_data_points.val();
			let img = new Image();
			img.src = '/static_metric/?metric_id=' + metric_id + '&validation_assignment_id={{ validation_item.id }}' + '&file_name=' + file_name;
			img.style.width = "85%"
			$metric_container.append(img);

			update_export_button(img.src, file_name);
		}

		function populate_dynamic_graph_metrics(metric, files){
			let $canvas = $('<canvas id="canvas-metric"></canvas>')
			$metric_container.append($canvas)

			let $dynamic_graph_metric_options = $('#dynamic_graph_metric_options');
			$dynamic_graph_metric_options.data('graph_config', metric['graph_config']);

			$select_dynamic_graph_metric_regions.empty();

			for(let region in files){
				$select_dynamic_graph_metric_regions.append(new Option(region, JSON.stringify(files[region])));
			}

			if(metric['graph_config']['misc']['data_model']==='daily_hydro_compartments'){
				$select_dynamic_graph_metric_year.append(new Option('All', -1))

				let num_days = metric['graph_config']['misc']['num_rows'];
				let max_year = Math.trunc(num_days/365);

				for(let x = 1; x<=max_year; x++){
					$select_dynamic_graph_metric_year.append(new Option(x, x))
				}
				$('#dynamic_graph_metric_daily_options').show();
			}

			populate_dynamic_graph_metric_data_points($select_dynamic_graph_metric_regions.find('option:selected').val());
			populate_dynamic_graph_metric_container(metric['graph_config']);

			$dynamic_graph_metric_options.show();
		}

		function populate_dynamic_graph_metric_data_points(data_points){
			data_points = JSON.parse(data_points);
			$select_dynamic_graph_metric_data_points.empty();
			for(let data_point in data_points){
				$select_dynamic_graph_metric_data_points.append(new Option(data_point, data_points[data_point]))
			}
		}

		function populate_dynamic_graph_metric_container(){
			let $canvas = $('#canvas-metric');
			let chart_config = $('#dynamic_graph_metric_options').data('graph_config');
			$canvas.empty();
			const metric_id = $metric_select.find('option:selected').data('metric_id');
			const file_name = $select_dynamic_graph_metric_data_points.val();
			const column_name = chart_config['misc']['column_name'];
			const year = $select_dynamic_graph_metric_year.val();

			$.get('/dynamic_graph_metric/?metric_id=' + metric_id + '&validation_assignment_id={{ validation_item.id }}' + '&file_name=' + file_name + '&year=' + year, function(response){
				response = JSON.parse(response)
				let max_tick = response.length;
				let graph_data = []
				response.forEach(function(e, i){
					graph_data.push({
						x: i,
						y: parseFloat(e[column_name])
					})
				})

				chart_config['options']['scales']['xAxes'][0]['ticks']['max'] = max_tick;

				let labels = []
				for(let year = 0; year <= max_tick; year++)
					labels.push(year)

				chart_config['data'] = {'labels': labels, 'datasets':[{'label': file_name, 'data': graph_data, 'fill': false, 'backgroundColor': '#ff6384', 'borderColor': '#ff6384', 'lineTension': 0}]}
				let chart = new Chart($canvas, chart_config)
			})
		}

		function populate_map_metrics(metric, files){
			let $map_metric_options = $('#map_metric_options');

			$select_map_year.empty();

			for(let parent_key in files)
				for(let year in files[parent_key])
					$select_map_year.append(new Option(year, files[parent_key][year]));

			populate_map_metric_container();

			$map_metric_options.show();
		}

		function populate_map_metric_container(){
			$metric_container.empty();

			let metric_id = $metric_select.find('option:selected').data('metric_id');
			let file_name = $select_map_year.val();
			let img = new Image();
			img.src = '/map_metric/?metric_id=' + metric_id + '&validation_assignment_id={{ validation_item.id }}' + '&file_name=' + file_name;
			$metric_container.append(img);
			const panzoom = Panzoom(img, {
				canvas: true,
				maxScale: 100
			})

			panzoom.pan(10, 10)

			document.getElementById('metric_container').addEventListener('wheel', function(event) {
			  if (!event.shiftKey) return
			  panzoom.zoomWithWheel(event)
			})

			update_export_button(img.src, file_name)
		}

		function load_comments(){
			clear_comments();

			let metric_id = $('#metric_select').find('option:selected').data('metric_id');
			let metric_options = {}
			$('.metric_options:visible').find('.form-control:not(#select_dynamic_graph_metric_year)').each(function(index, element){
				metric_options[$(this).attr('name')] = $(this).find('option:selected').text();
			});
			metric_options = encodeURI(JSON.stringify(metric_options))

			$.get("{% url 'get_comments' %}?metric_options="+ metric_options +"&metric_id=" + metric_id + "&validation_assignment_id="+ {{ validation_item.id }}, function(data){
				add_comments(JSON.parse(data));
			})
		}

		function clear_comments(){
			$("#container-oi-comments").empty();
		}

		function add_comments(comments_list){
			for(let comment of comments_list){
				add_comment(comment);
			}
		}

		function add_comment(comment_dict){
			let $comment_container = $('#comment-container-template').clone();
			$comment_container.attr('id', '');
			$comment_container.find('#user-comment-template').text(comment_dict['user_name']).attr('id', '')
			$comment_container.find('#comments-comment-template').text(comment_dict['comments']).attr('id', '');

			if(comment_dict['is_review'])
				$comment_container.addClass(comment_dict['is_flag'] ? 'list-group-item-danger' : 'list-group-item-info').addClass('review-comment');
			else if(comment_dict['user_name'] === user_name) {
				$comment_container.attr('data-bs-toggle', 'modal').attr('data-bs-target', '#modal-misc-comment').attr('data-bs-comment_id', comment_dict['id']);
			}

			$("#container-oi-comments").append($comment_container);
		}

		function update_export_button(url, file_name){
			$export_button.data('download', url)
			$export_button.data('file_name', file_name)
		}

		// Start Listener Region

		$('#modal-misc-comment').on('show.bs.modal', function(e){
			// this is a new modal so we do a get request to load the HTML
			let $modal = $(this);
			let clicked_element = $(e.relatedTarget);
			let comment_id = clicked_element.attr('data-bs-comment_id') !== undefined ? clicked_element.attr('data-bs-comment_id') : '';

			$modal.empty();
			$.get("{% url 'comment_modal_view' 'misc' %}"+comment_id, function(response){
				$modal.append(response);
				$('#misc-comment-save').on('click', function(){
					let comment = $modal.find('#textarea-comment').val();

					let body = {
						comments: comment,
						validation_assignment_id: {{ validation_item.id }}
					}

					body['metric_options'] = {}
					$('.metric_options:visible').find('.form-control').each(function(index, element){
						body['metric_options'][$(this).attr('name')] = $(this).find('option:selected').text();
					})
					body['metric_id'] = $('#metric_select').find('option:selected').data('metric_id');

					$.post({
						url: "{% url 'validation_assignment_comment' %}",
						headers: {'X-CSRFToken': csrftoken},
						data: JSON.stringify(body),
						success: function(data){
							data = JSON.parse(data)
							data['user_name'] = user_name
							add_comment(data)
							let bs_modal = bootstrap.Modal.getInstance($modal[0]);
							bs_modal.hide();
							$modal.empty();
						}
					});
				});

				$('#misc-comment-delete').on('click', function(){
					$.ajax({
							url: "{% url 'validation_assignment_comment' %}" + comment_id ,
							type: 'DELETE',
							headers: {'X-CSRFToken': Cookies.get('csrftoken')},
							success: function(){
								let bs_modal = bootstrap.Modal.getInstance($modal[0]);
								bs_modal.hide();
								$modal.empty();
								clicked_element.empty();
							}
					});
				})
			});
		});

		$('#modal-review-comment').on('show.bs.modal', function(e){
			// this is a new modal so we do a get request to load the HTML
			let $modal = $(this);
			$modal.empty();

			let metric_id = $('#metric_select').find('option:selected').data('metric_id');
			let metric_options = {}
			$('.metric_options:visible').find('.form-control').each(function(index, element){
				metric_options[$(this).attr('name')] = $(this).find('option:selected').text();
			});
			metric_options = encodeURI(JSON.stringify(metric_options))

			$.get("{% url 'comment_modal_view' 'review' %}?metric_options="+ metric_options +"&metric_id=" + metric_id + "&validation_assignment_id="+ {{ validation_item.id }}, function(response){
				$modal.append(response);
				$('#review-comment-save').on('click', function(){
					let radio_id = $modal.find('.form-check-input:radio:checked').attr('id');
					let comment = $modal.find('#textarea-comment').val();
					let is_flag = radio_id === 'not-intuitive' ? $modal.find('#checkbox-flag').is(':checked') : 0;

					let body = {
						comments: comment,
					    is_flag: is_flag,
						is_review: 1,
						review_option: radio_id,
						validation_assignment_id: {{ validation_item.id }}
					}

					body['metric_options'] = {}
					$('.metric_options:visible').find('.form-control').each(function (index, element) {
						body['metric_options'][$(this).attr('name')] = $(this).find('option:selected').text();
					})
					body['metric_id'] = $('#metric_select').find('option:selected').data('metric_id');


					$.post({
						url: "{% url 'validation_assignment_comment' %}",
						headers: {'X-CSRFToken': csrftoken},
						data: JSON.stringify(body),
						success: function(){
							body['user_name'] = user_name

							$('.review-comment').each(function(){
								if($(this).find('strong').text() === user_name){
									$(this).remove();
								}
							})

							add_comment(body)
							let bs_modal = bootstrap.Modal.getInstance($modal[0]);
							bs_modal.hide();
							$modal.empty();

						}
					});
				});
			});
		});

		$metric_select.on('change', metric_change);

		$select_static_metric_regions.on('change', function(){
				populate_static_metric_data_points($(this).val())
				populate_static_metric_container();
				load_comments();
			});

		$select_static_metric_data_points.on('change', function(){
				populate_static_metric_container();
				load_comments();
			});

		$select_dynamic_graph_metric_regions.on('change', function(){
			populate_dynamic_graph_metric_data_points($(this).val())
			populate_dynamic_graph_metric_container();
			load_comments();
		});

		$select_dynamic_graph_metric_data_points.on('change', function(){
			populate_dynamic_graph_metric_container();
			load_comments();
		});

		$select_dynamic_graph_metric_year.on('change', function(){
			populate_dynamic_graph_metric_container();
			load_comments();
		})

		$select_map_year.on('change', function(){
			populate_map_metric_container();
			load_comments();
		});

		$export_button.on('click', function(){
			console.log($(this).data('download'))
			let link = document.createElement('a')
			link.href = $(this).data('download');
			link.download = $(this).data('file_name');
			document.body.appendChild(link);
			link.click()
			document.body.removeChild(link);
		})

		// End Listener Region
	});
</script>

<div class="container-fluid">
	<div class="row">
		<div class="col-10">
			<div class="row my-4">
				<div class="col-3">
			<h5>
				{{ validation_item.sr_id.sim_id.name }}
				{{ validation_item.sr_id.name }}
				{{ validation_item.sub_id.name }}
				{{ validation_item.vi_id.name }}
			</h5>
					<a href="{% url 'validation_item_overview' validation_item.id %}">Overview</a>
				</div>
				<div class="col-6">
					<h2 id="metric_name" style="text-align: center;"></h2>
				</div>
				<div class="col-3">
					<button id="btn-review" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-review-comment">Review</button>
					<button id="btn-export" class="btn btn-primary">Export</button>
				</div>
			</div>
			<div class="row flex-grow-1">
				<div class="col-2">
					<label for="metric_select">Metric</label>
					<select name="metric" id="metric_select" class="form-control">
						{% for metric in metrics %}
							<option data-metric_id="{{ metric.id }}"
							>{{ metric.name }}</option>
						{% endfor %}
					</select>
					<div id="static_metric_options" class="metric_options" style="display: none;">
						<label for="select_static_metric_region">Region</label>
						<select name="region" class="form-control" id="select_static_metric_region"></select>
						<label for="select_static_metric_data_points">Data Points</label>
						<select name="data_point" class="form-control" id="select_static_metric_data_points"></select>
					</div>
					<div id="dynamic_graph_metric_options" class="metric_options" style="display: none;">
						<label for="select_dynamic_graph_metric_region">Region</label>
						<select name="region" class="form-control" id="select_dynamic_graph_metric_region"></select>
						<label for="select_dynamic_graph_metric_data_points">Data Points</label>
						<select name="data_point" class="form-control" id="select_dynamic_graph_metric_data_points"></select>
					</div>
					<div id="dynamic_graph_metric_daily_options" class="metric_options" style="display: none;">
						<label for="select_dynamic_graph_metric_year">Year</label>
						<select name="year" class="form-control" id="select_dynamic_graph_metric_year"></select>
					</div>
					<div id="map_metric_options" class="metric_options" style="display: none;">
						<label for="select_map_year">Year</label>
						<select name="year" class="form-control" id="select_map_year"></select>
					</div>
				</div>
				<div class="col-10">
<!--							This is where the actual graph/static image will go -->
					<div id="metric_container" class="row px-2"></div>

				</div>
			</div>
		</div>
		<div class="col-2 bg-light" style="border: 1px solid #C5C5C5">
			<div class="row my-2 py-2">
				<div class="col-12">
					<h4>Comments</h4>
					<div id="container-oi-comments" class="list-group">
					</div>
					<button id="btn-new-comment" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-misc-comment">New</button>
				</div>
			</div>
		</div>
	</div>
</div>

<div id="container-templates" style="display: none;">
	<div id="comment-container-template" class="list-group-item-action">
		<strong id="user-comment-template"> </strong>
		<p id="comments-comment-template"> </p>
	</div>
</div>

<div class="modal fade" id="modal-misc-comment" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
	<div class="modal-dialog"></div>
</div>
<div class="modal fade" id="modal-review-comment" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
	<div class="modal-dialog"></div>
</div>
{% endblock %}
