{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container-fluid">
			<div class="row justify-content-center my-4">
			<h1>{{ metric.name }}</h1>
			</div>
			<div class="row">
				<div class="col-3 ">
					<div class="row justify-content-center">
						<h2>Details</h2>
					</div>
					<div class="row justify-content-center">
						<form>
						  <div class="form-group">
							<label for="exampleInputName">Name</label>
							<input type="text" class="form-control" id="exampleInputName" aria-describedby="emailHelp" value="{{ metric.name }}">
						  </div>
							<div class="form-group">
							<label for="exampleSelectGroup">Type</label>
							  
							<select value="{{ metric.type }}">
								<option value="Live Graph">Live Graph</option>
								<option value="Static">Static</option>
								<option value="Map">Map</option>
							</select>	
						  </div>
						  <div class="form-group">
							<label for="examplePath">File Path</label>
							<input type="text" class="form-control" id="examplePath" aria-describedby="emailHelp" value="{{ metric.file_path }}">
						  </div>
<button type="submit" class="btn btn-primary">Save Changes</button>
						</form>
					</div>
				</div>
				<div class="col-9">
					<div class="row justify-content-center">
						<h2>Graph Configuration</h2>
					</div>
						<textarea class="form-control" id="exampleFormControlTextarea1">{{ metric.graph_config }}</textarea>
				</div>
			</div>
		</div>

{% endblock %}
