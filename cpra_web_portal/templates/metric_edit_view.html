{% extends 'base.html' %}
{% load static %}
{% block content %}

<script>
	$(document).ready(function(){
		const csrftoken = Cookies.get('csrftoken');
		$("#btn-metric-save").on("click", function(e){
			let data = {}
			let $validation_error_block = $('#validation_errors');
			$validation_error_block.empty();

			{% if metric.id != None %}
			  data['id'] = {{ metric.id }}

			{% endif %}
			// Gather data here to convert to JSON
			// Iterate over form-control fields and get the data
			$(".form-control").each(function(index, element){
				let $element = $(element);
				if($element.attr('name') === 'graph_config') {
					try{
						data[$element.attr('name')] = JSON.parse($element.val());
					}
					catch (err){
						$validation_error_block.text('Invalid JSON, please modify.');
					}
				}
				else
					data[$element.attr('name')] = $element.val();
			});

			if($validation_error_block.text().length > 0)
				return;

			// perform post request
			$.post({
				url: "{% url 'metric_new_view' %}",
				headers: {'X-CSRFToken': csrftoken},
				data: JSON.stringify(data),
				success: function(response){
					window.location.replace(JSON.parse(response)['url'])
				}
			})
		});
	});
</script>
<div class="container-fluid">
			<div class="row justify-content-center my-4">
			<h1>{{ metric.name }}</h1>
			</div>
			<div class="row">
				<div class="col-3 ">
					<div class="row justify-content-center">
						<h2>Details</h2>
					</div>
					<div class="row justify-content-center">
						<form>
						  <div class="form-group">
							<label for="metric_name">Name</label>
							<input name="name" id="metric_name" type="text" class="form-control" aria-describedby="emailHelp" value="{{ metric.name }}" required>
						  </div>
							<div class="form-group">
							<label for="metric_type">Type</label>

							<select name="type" id="metric_type" class="form-control" required>
								<option value="dynamic_graph" {% if metric.type == "dynamic_graph" %} selected {% endif %}> Live Graph</option>
								<option value="static" {% if metric.type == "static" %} selected {% endif %}>Static</option>
								<option value="map" {% if metric.type == "map" %} selected {% endif %}>Map</option>
								<option value="download" {% if metric.type == "download" %} selected {% endif %}>Download Only</option>
							</select>	
						  </div>
						  <div class="form-group">
							<label for="metric_file_path">File Path</label>
							<input name="file_path" id="metric_file_path" type="text" class="form-control" aria-describedby="emailHelp" value="{{ metric.file_path }}" required>
						  </div>
							<button id="btn-metric-save" type="button" class="btn btn-primary">Save Changes</button>
						</form>
					</div>
				</div>
				<div class="col-9">
					<div class="row justify-content-center">
						<h2>Graph Configuration</h2>
					</div>
						<label for="metric_graph_config" style="display: none;"></label>
						<textarea name="graph_config" class="form-control" id="metric_graph_config">{{ metric.graph_config }}</textarea>
						<p style="color:red;" id="validation_errors"></p>
				</div>
			</div>
		</div>

{% endblock %}
