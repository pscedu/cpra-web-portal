{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container">
	<div class="row my-2">
		<div class="col-12">
			<h1> Active <a href="{% url 'users_list_view' %}">Users</a></h1>
        </div>
	</div>
	<div class="row my-2">
		<div class="col-12">
			<table class="table">
			  <thead>
				<tr>
				  <th scope="col">Name</th>
				  <th scope="col">Group</th>
				  <th scope="col">Last Login</th>
				</tr>
			  </thead>
			  <tbody>

			  {% for user in users %}
				<tr>
				  <th scope="row">{{ user.username }}</th>
				  <td>
					  {% for group in user.groups.all %}
					  	{{ group.name }}
					  {% endfor %}
				  </td>
				  <td>{{ user.last_login }}</td>
				</tr>
			  {% endfor %}
			  </tbody>
			</table>
        </div>
	</div>
</div>
{% endblock %}
